  <line x1="30" y1="105" x2="170" y2="105" stroke="rgba(200,75,255,.15)" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgba(200, 75, 255, 0.15);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

