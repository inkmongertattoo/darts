  <line x1="0" y1="100" x2="200" y2="100" stroke="rgba(180,100,255,.08)" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgba(180, 100, 255, 0.08);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="0" y1="150" x2="200" y2="150" stroke="rgba(180,100,255,.08)" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgba(180, 100, 255, 0.08);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="50" y1="0" x2="50" y2="200" stroke="rgba(180,100,255,.08)" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgba(180, 100, 255, 0.08);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="rgba(180,100,255,.08)" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgba(180, 100, 255, 0.08);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="150" y1="0" x2="150" y2="200" stroke="rgba(180,100,255,.08)" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:rgba(180, 100, 255, 0.08);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

