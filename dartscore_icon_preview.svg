  <line x1="160" y1="48" x2="112" y2="100" stroke="#a090c8" stroke-width="2.5" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(160, 144, 200);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="110" cy="102" r="2.5" fill="#00f0ff" style="fill:rgb(0, 240, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="148" y="56" width="14" height="5" rx="2" fill="#ffe600" transform="rotate(-44 155 58.5)" style="fill:rgb(255, 230, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M162 46 L174 36 L167 49 Z" fill="#ffe600" opacity="0.9" style="fill:rgb(255, 230, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M162 46 L160 33 L167 49 Z" fill="#ff9900" opacity="0.7" style="fill:rgb(255, 153, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- DART 3 — slightly above bull -->
  <line x1="100" y1="35" x2="100" y2="94" stroke="#a090c8" stroke-width="2.5" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(160, 144, 200);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="100" cy="94" r="2.5" fill="#00f0ff" style="fill:rgb(0, 240, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="93" y="28" width="14" height="5" rx="2" fill="#00f0a0" style="fill:rgb(0, 240, 160);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M100 35 L90 22 L103 33 Z" fill="#00f0a0" opacity="0.9" style="fill:rgb(0, 240, 160);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <path d="M100 35 L110 22 L103 33 Z" fill="#00f0ff" opacity="0.7" style="fill:rgb(0, 240, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Score text: 180 -->
  <text x="100" y="178" text-anchor="middle" font-family="'Orbitron', monospace" font-size="18" font-weight="900" fill="#c84bff" letter-spacing="3" opacity="0.9" style="fill:rgb(200, 75, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:Orbitron, monospace;font-size:18px;font-weight:900;text-anchor:middle;dominant-baseline:auto">180</text>
  <!-- DS text top left subtle -->
  <text x="18" y="28" font-family="'Orbitron', monospace" font-size="11" font-weight="700" fill="rgba(200,75,255,.6)" letter-spacing="1" style="fill:rgba(200, 75, 255, 0.6);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Orbitron, monospace;font-size:11px;font-weight:700;text-anchor:start;dominant-baseline:auto">DS</text>
</g>

<!-- Label below -->
<text x="190" y="246" text-anchor="middle" font-family="'Orbitron', monospace" font-size="13" font-weight="700" fill="rgba(200,75,255,.8)" letter-spacing="3" style="fill:rgba(200, 75, 255, 0.8);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Orbitron, monospace;font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:auto">DARTSCORE</text>
