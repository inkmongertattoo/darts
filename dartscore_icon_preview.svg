  <circle cx="100" cy="105" r="22" fill="none" stroke="rgba(0,240,255,.7)" stroke-width="1.5" style="fill:none;stroke:rgba(0, 240, 255, 0.7);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
